[package]
name = "paladinscat-backend"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
async-trait = "0.1"
aes-gcm = "0.10"
anyhow = "1"
axum = "0.8"
base64 = "0.22"
chrono-tz = "0.10"
deadpool-postgres = "0.14"
flate2 = "1"
futures = "0.3"
jsonwebtoken = "9"
paladinscat-core = { path = "../paladinscat-core" }
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
subtle = "2"
thiserror = "2"
time = { version = "0.3", features = ["macros", "parsing", "serde"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "net", "sync", "time"] }
tokio-postgres = { version = "0.7", features = ["with-time-0_3"] }
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
url = "2"
uuid = { version = "1", features = ["v4"] }

[[bin]]
name = "paladinscat-api"
path = "src/bin/api.rs"

[[bin]]
name = "paladinscat-worker"
path = "src/bin/worker.rs"

[[bin]]
name = "paladinscat-admin"
path = "src/bin/admin.rs"
