[package]
name = "paladinscat-hirez-relay"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
aes-gcm = "0.10"
async-trait = "0.1"
axum = "0.8"
base64 = "0.23"
deadpool-postgres = "0.14"
futures = "0.3"
hex = "0.4"
md-5 = "0.10"
paladinscat-core = { path = "../paladinscat-core" }
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
time = { version = "0.3", features = ["formatting", "macros", "parsing", "serde"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "net", "sync", "time"] }
tokio-postgres = { version = "0.7", features = ["with-serde_json-1", "with-time-0_3"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1", features = ["v4"] }
